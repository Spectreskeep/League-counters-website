// ===============================
// 2) FILTER / GENERATE / RESET
// ===============================
var isFilterPaused = false;

/* ---------- name→key helpers (work with spaces/apostrophes etc) ---------- */
const __norm = s => (s || "").toLowerCase().replace(/['’\s._-]/g, "");
const KEY_BY_NORM = Object.fromEntries(Object.keys(imageMapping).map(k => [__norm(k), k]));

function keyFromDisplayName(name) {
  return KEY_BY_NORM[__norm(name)] || null;
}
function keyFromFilename(src) {
  const base = (src || "").split("/").pop().split(".")[0];
  return KEY_BY_NORM[__norm(base)] || null;
}

/* ---------- wire clicks on the grid thumbnails ---------- */
function wireGridClicks() {
  document.querySelectorAll('#image-container img').forEach(img => {
    if (img.__wired) return;
    img.__wired = true;
    img.style.cursor = 'pointer';
    img.addEventListener('click', () => {
      const displayName = img.dataset.name || "";
      const key = keyFromDisplayName(displayName);
      if (!key) { alert("No image mapping found for " + displayName); return; }
      const input = document.getElementById("search-bar");
      if (input) input.value = displayName;      // keep the nice display text
      generateImages(key);                       // run by canonical key
    });
  });
}

/* ---------- wire clicks on the RESULT images (enemy + counters) ---------- */
function wireResultClicks() {
  ["result-image-1","result-image-2","result-image-3","result-image-4","result-image-5","result-image-6"]
    .forEach(id => {
      const el = document.getElementById(id);
      if (!el || el.__wired) return;
      el.__wired = true;
      el.style.cursor = "pointer";
      el.addEventListener("click", () => {
        // Prefer data-name we set, fall back to filename
        const key = (el.dataset.name && keyFromDisplayName(el.dataset.name)) || keyFromFilename(el.src);
        if (!key) return;
        const input = document.getElementById("search-bar");
        if (input) {
          input.value = key.charAt(0).toUpperCase() + key.slice(1);
        }

        generateImages(key);
      });
    });
}

function filterImages() {
  if (isFilterPaused) return;
  var searchTerm = document.getElementById("search-bar").value.toLowerCase();
  var images = document.querySelectorAll("#image-container img");
  images.forEach(function (img) {
    var imageName = (img.getAttribute("data-name") || "").toLowerCase();
    img.style.display = imageName.includes(searchTerm) ? "inline-block" : "none";
  });
}

/* ---------- main generator: accepts optional forceKey ---------- */
function generateImages(forceKey) {
  // canonical key (works for typed input or forced key)
  const raw = forceKey || (document.getElementById("search-bar").value || "");
  const viaNorm = keyFromDisplayName(raw);
  const key = (forceKey || viaNorm || raw).toLowerCase();

  const ids = ["result-image-1","result-image-2","result-image-3","result-image-4","result-image-5","result-image-6"];
  const imgs = ids.map(id => document.getElementById(id));

  if (key && imageMapping.hasOwnProperty(key)) {
    isFilterPaused = true;
    const picks = imageMapping[key]; // array of filenames: [enemy, c1, c2, c3, c4, c5]

    // show labels
    const sLbl = document.querySelector('#spotlight .label');
    const cLbl = document.querySelector('#counters .label');
    if (sLbl) sLbl.style.display = 'inline-block';
    if (cLbl) cLbl.style.display = 'inline-block';

    // set enemy + counters
    // When setting result images
    imgs.forEach((el, i) => {
      if (el) {
        el.style.display = "block";
        el.src = picks[i] || "";
        // set proper data-name for tooltip
        if (picks[i]) {
          const champName = picks[i].split("/").pop().replace(/\..+$/, ""); // strip path + extension
          el.dataset.name = champName.charAt(0).toUpperCase() + champName.slice(1);

        }
      }
    });


    // hide the thumbnail grid
    document.querySelectorAll("#image-container img").forEach(img => img.style.display = "none");

    // ensure result images are clickable
    wireResultClicks();

  } else {
    alert("No image mapping found for " + raw);
  }
}

// ===============================
// 3) SMART AUTOCOMPLETE (predictive)
// (unchanged from your version)
// ===============================
const inputEl = document.getElementById('search-bar');
const sugEl   = document.getElementById('suggestions');

const NAMES = [...document.querySelectorAll('#image-container img')]
  .map(img => img.dataset.name).filter(Boolean);

const normalize = s => (s || "").toLowerCase().replace(/['’\s._-]/g,'');
const highlight = (label, q) => {
  if (!q) return label;
  const i = label.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return label;
  return label.slice(0,i) + '<mark>' + label.slice(i, i+q.length) + '</mark>' + label.slice(i+q.length);
};

function rankedFilter(q, list, limit=8) {
  const nq = normalize(q);
  if (nq.length < 2) return [];
  const starts = [], contains = [];
  for (const name of list) {
    const nn = normalize(name);
    if (nn.startsWith(nq)) starts.push(name);
    else if (nn.includes(nq)) contains.push(name);
  }
  return [...starts, ...contains].slice(0, limit);
}

let tId = null;
const debounce = (fn, ms=100) => (...args) => { clearTimeout(tId); tId = setTimeout(()=>fn(...args), ms); };

function renderSuggestions(items, q) {
  if (!sugEl) return;
  if (!items.length) { sugEl.style.display = 'none'; sugEl.innerHTML = ''; activeIndex = -1; return; }

  const r = inputEl.getBoundingClientRect();
  sugEl.style.left  = r.left + 'px';
  sugEl.style.top   = (r.bottom + window.scrollY) + 'px';
  sugEl.style.width = r.width + 'px';

  sugEl.innerHTML = items.map(n => `<div class="suggestion" data-value="${n}">${highlight(n, q)}</div>`).join('');
  sugEl.style.display = 'block';
  activeIndex = -1;
}

const update = debounce(() => {
  const q = (inputEl?.value || "").trim();
  const items = rankedFilter(q, NAMES, 8);
  renderSuggestions(items, q);
}, 100);

if (inputEl) {
  inputEl.addEventListener('input', update);
  inputEl.addEventListener('focus', () => { if ((inputEl.value || "").trim().length >= 2) update(); });
}

if (sugEl) {
  sugEl.addEventListener('mousedown', (e) => {
    const it = e.target.closest('.suggestion');
    if (!it) return;
    inputEl.value = it.dataset.value;
    sugEl.style.display = 'none';
    filterImages();
  });
  let activeIndex = -1;
  if (inputEl) {
    inputEl.addEventListener('keydown', (e) => {
      const items = [...sugEl.querySelectorAll('.suggestion')];
      if (!items.length) return;
      if (e.key === 'ArrowDown') { e.preventDefault(); activeIndex = (activeIndex + 1) % items.length; }
      else if (e.key === 'ArrowUp') { e.preventDefault(); activeIndex = (activeIndex - 1 + items.length) % items.length; }
      else if (e.key === 'Enter') {
        if (activeIndex >= 0) {
          e.preventDefault();
          inputEl.value = items[activeIndex].dataset.value;
          sugEl.style.display = 'none';
          filterImages();
        }
      } else if (e.key === 'Escape') {
        sugEl.style.display = 'none'; activeIndex = -1; return;
      } else { return; }
      items.forEach((el,i)=>el.classList.toggle('active', i===activeIndex));
    });
    inputEl.addEventListener('blur', () => setTimeout(()=>{ sugEl.style.display = 'none'; }, 120));
  }
}

];

const vids = [ document.getElementById('bg1'), document.getElementById('bg2') ];
let show = 0;  // visible video

function setSrc(el, src){ el.src = src; el.load(); }
function safePlay(el){ el.muted = true; el.play().catch(()=>{}); }

function crossfadeTo(nextIdx){
  const hidden = (show ^ 1);
  setSrc(vids[hidden], BG_FILES[nextIdx]);
  vids[hidden].onended = onEnded;
  safePlay(vids[hidden]);
  vids[hidden].classList.add('visible');
  vids[show].classList.remove('visible');
  show = hidden;
  idx = nextIdx;
}
function onEnded(){ crossfadeTo( (idx + 1) % BG_FILES.length ); }

setSrc(vids[show], BG_FILES[idx]);
vids[show].onended = onEnded;
safePlay(vids[show]);

// === Floating tooltip that follows the cursor ===
(function initFloatingChampTooltip(){
  // Create tooltip element once
  const tip = document.createElement('div');
  tip.id = 'champ-tooltip';
  document.body.appendChild(tip);

  const SEL = '#image-container img, #counter-images img, #spotlight img';

  // Track mouse to move tooltip
document.addEventListener('mousemove', (e) => {
  if (!tip.classList.contains('on')) return;

  // Position tooltip top-right of cursor
  const offsetX = 8, offsetY = -28;
  let x = e.clientX + offsetX;
  let y = e.clientY + offsetY;

  // keep inside viewport
  const rect = tip.getBoundingClientRect();
  const vw = window.innerWidth, vh = window.innerHeight;
  if (x + rect.width > vw)  x = e.clientX - rect.width - offsetX;
  if (y < 0) y = e.clientY + 20; // flip below cursor if too high

  tip.style.left = x + 'px';
  tip.style.top  = y + 'px';
});


  // Wire up all champ images
  function attach(img){
    // show on hover
    img.addEventListener('mouseenter', () => {
      const name = img.dataset.name || img.alt || 'Unknown';
      tip.textContent = name;
      tip.classList.add('on');
    });
    // hide when leaving
    img.addEventListener('mouseleave', () => {
      tip.classList.remove('on');
    });
    // for keyboard focus accessibility
    img.addEventListener('focus', () => {
      const name = img.dataset.name || img.alt || 'Unknown';
      tip.textContent = name;
      tip.classList.add('on');
    });
    img.addEventListener('blur', () => tip.classList.remove('on'));
  }

  document.querySelectorAll(SEL).forEach(attach);

  // If you dynamically show/hide or replace result images, reattach as needed:
  // Example: after generateImages() updates sources, you could call:
  // document.querySelectorAll(SEL).forEach(attach);
})();
